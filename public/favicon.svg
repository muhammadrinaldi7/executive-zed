<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background: Signature Slate-950 Dark Theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Theme Brand Gradient: Indigo -> Purple/Violet -> Emerald (Matches App Theme) -->
    <linearGradient id="brandZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="45%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Indigo/Emerald Neon Border -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Ambient Glow effect matching app glassmorphism -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Slate-950 Dark Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="1.5" />

  <!-- Subtle Inner Hairline Frame -->
  <rect x="5" y="5" width="54" height="54" rx="12" fill="none" stroke="#6366F1" stroke-opacity="0.15" stroke-width="1" />

  <!-- Ambient Glow Behind Z -->
  <circle cx="32" cy="32" r="14" fill="#6366F1" opacity="0.15" filter="blur(6px)" />

  <!-- Modern Executive 'Z' with Theme Gradient -->
  <g filter="url(#neonGlow)">
    <path 
      d="M17 17.5 H47 V24.5 L27 41 H47 V47.5 H17 V40.5 L37 24 H17 Z" 
      fill="url(#brandZ)" 
    />
    <!-- Crisp White Specular Accent on Top Bar -->
    <line x1="17.5" y1="18" x2="46.5" y2="18" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Sparkle Accent (Matches Executive AI / Intelligence Theme) -->
  <circle cx="47" cy="17.5" r="1.5" fill="#34D399" />
</svg>